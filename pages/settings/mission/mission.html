</head>
<body>
  <div class="extension-container">
    <header class="topbar">
      <button class="icon-button" id="backBtn" data-i18n-aria="back" aria-label="Back">

          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>

      <h1 class="topbar__title" data-i18n="missionTitle">Mission</h1>
