<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Latitude Rule — Miqat</title>
  <link rel="stylesheet" href="../settings.css">
</head>
<body>
  <div class="extension-container">
    <header class="topbar">
      <button class="icon-button" id="backBtn" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="topbar__title" data-i18n="highLatitudeTitle">High Latitude Rule</h1>
    </header>
    <div class="info-box" data-i18n="highLatitudeInfoBox">For locations above 48° latitude where twilight may not disappear, a rule is applied to estimate Fajr and Isha.</div>
    <div id="hlGroup" class="option-list" role="radiogroup"></div>
  </div>
  <script type="module" src="high-latitude.js"></script>
</body>
</html>
