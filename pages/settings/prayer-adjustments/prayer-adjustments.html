<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Time Adjustments — Miqat</title>
  <link rel="stylesheet" href="../settings.css">
</head>
<body>
  <div class="extension-container">
    <header class="topbar">
      <button class="icon-button" id="backBtn" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="topbar__title" data-i18n="prayerAdjustmentsTitle">Prayer Time Adjustments</h1>
    </header>
    <p class="page-hint" data-i18n="prayerAdjustmentsHint">Offset each prayer time in minutes (±60). Today's times update below as you adjust.</p>
    <div id="stepperList" class="stepper-list"></div>
  </div>
  <script src="../../../lib/adhan.umd.min.js"></script>
  <script type="module" src="prayer-adjustments.js"></script>
</body>
</html>
