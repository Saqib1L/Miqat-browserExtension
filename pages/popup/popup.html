<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Times Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="extension-container">
    <!-- Header: Location & Quick Controls -->
    <header class="header-bar">
      <div class="location-wrapper" id="userLocation">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="location-text">Road 902, Riffa</span>
      </div>
      
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" aria-label="Toggle Theme">
          <!-- Sun Icon (visible in dark mode) -->
          <svg id="icon-sun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          
          <!-- Moon Icon (visible in light mode) -->
          <svg id="icon-moon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-button" id="settingsBtn" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Wraps dynamic day content for animations -->
    <div class="day-content" id="dayContent">

      <!-- Current Prayer Status Display -->
      <section class="hero-section">
        <h1 class="current-prayer-title" id="currentPrayerName">Isha</h1>
        <div class="next-prayer-countdown" id="nextPrayerCountdown">
          07:23:47 until Fajr
        </div>
      </section>

      <!-- Dates Indicator Strip -->
      <div class="date-strip">
        <!-- Top Row: Today Pill -->
        <div class="date-strip-header">
          <button class="today-pill" id="todayBtn">
            <svg class="today-pill__arrow today-pill__arrow--left icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Today</span>
            <svg class="today-pill__arrow today-pill__arrow--right icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- Bottom Row: Navigation Arrows & Dates -->
        <div class="date-strip-body">
          <button class="date-nav-btn" id="prevDateBtn" aria-label="Previous Day">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="date-info">
            <div class="gregorian-date" id="gregorianDate">Tuesday, 25 August</div>
            <div class="hijri-date" id="hijriDate">12 Rabi' Al-Awwal 1448 AH</div>
          </div>
          <button class="date-nav-btn" id="nextDateBtn" aria-label="Next Day">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- Prayer Schedule List -->
      <main class="prayer-list">
        <div class="prayer-card" data-prayer="fajr">
          <div class="prayer-info">
            <span class="prayer-name">Fajr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">3:54 AM</span>
            <button class="audio-toggle-btn" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="prayer-card" data-prayer="sunrise">
          <div class="prayer-info">
            <span class="prayer-name">Sunrise</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">5:14 AM</span>
            <button class="audio-toggle-btn muted" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="prayer-card" data-prayer="dhuhr">
          <div class="prayer-info">
            <span class="prayer-name">Dhuhr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">11:45 AM</span>
            <button class="audio-toggle-btn" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="prayer-card" data-prayer="asr">
          <div class="prayer-info">
            <span class="prayer-name">Asr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">3:10 PM</span>
            <button class="audio-toggle-btn" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="prayer-card" data-prayer="maghrib">
          <div class="prayer-info">
            <span class="prayer-name">Maghrib</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">6:07 PM</span>
            <button class="audio-toggle-btn" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="prayer-card active" data-prayer="isha">
          <div class="prayer-info">
            <span class="prayer-name">Isha</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">7:17 PM</span>
            <button class="audio-toggle-btn" aria-label="Toggle Notification Audio">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
        </div>
      </main>

    </div><!-- /.day-content -->
  </div>

  <script src="../../lib/adhan.umd.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
