<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Times Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">

    <div class="adhan-banner" id="adhanBanner" hidden>
      <span class="adhan-banner__text">Adhan is playing</span>
      <button class="adhan-banner__stop" id="adhanStopBtn">Stop</button>
    </div>

    <header class="header-bar">
      <div class="location-wrapper" id="userLocation">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span class="location-text" id="locationText" data-i18n="locating">Locating…</span>
      </div>

      <div class="header-actions">

       <button class="icon-button volume-toggle" id="volume-toggle" aria-label="Toggle Notification Sound" aria-pressed="false">
        <svg class="icon" id="popup-volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>

        <button class="icon-button" id="theme-toggle" aria-label="Toggle Theme">
          <svg id="icon-sun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>

          <svg id="icon-moon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <button class="icon-button" id="settingsBtn" data-i18n-aria="settingsTitle" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

      </div>
    </header>

    <div class="day-content" id="dayContent">

      <section class="hero-section">
        <h1 class="current-prayer-title" id="currentPrayerName">Isha</h1>
        <div class="next-prayer-countdown" id="nextPrayerCountdown">
          07:23:47 until Fajr
        </div>
      </section>

      <div class="date-strip">
        <div class="date-strip-header">
          <button class="today-pill" id="todayBtn">
            <svg class="today-pill__arrow today-pill__arrow--left icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span data-i18n="today">Today</span>
            <svg class="today-pill__arrow today-pill__arrow--right icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="date-strip-body">
          <button class="date-nav-btn" id="prevDateBtn" aria-label="Previous Day">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="date-info">
            <div class="gregorian-date" id="gregorianDate">Tuesday, 25 August</div>
            <div class="hijri-date" id="hijriDate">12 Rabi' Al-Awwal 1448 AH</div>
          </div>

          <button class="date-nav-btn" id="nextDateBtn" aria-label="Next Day">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <main class="prayer-list">
        <div class="prayer-card" data-prayer="fajr">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="fajr">Fajr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">3:54 AM</span>
          </div>
        </div>

        <div class="prayer-card" data-prayer="sunrise">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="sunrise">Sunrise</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">5:14 AM</span>
          </div>
        </div>

        <div class="prayer-card" data-prayer="dhuhr">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="dhuhr">Dhuhr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">11:45 AM</span>
          </div>
        </div>

        <div class="prayer-card" data-prayer="asr">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="asr">Asr</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">3:10 PM</span>
          </div>
        </div>

        <div class="prayer-card" data-prayer="maghrib">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="maghrib">Maghrib</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">6:07 PM</span>
          </div>
        </div>

        <div class="prayer-card active" data-prayer="isha">
          <div class="prayer-info">
            <span class="prayer-name" data-i18n="isha">Isha</span>
          </div>
          <div class="prayer-time-group">
            <span class="prayer-time">7:17 PM</span>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="../../lib/adhan.umd.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
